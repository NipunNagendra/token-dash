name: weekly-pull
on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 06:00 ET (10:00 UTC; 11:00 UTC in winter — cron is UTC)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: weekly
jobs:
  pull-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python run.py all
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Commit data + site
        run: |
          git config user.name "token-dash bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          git commit -m "weekly pull $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: pull-and-build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
