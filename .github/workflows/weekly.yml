name: weekly-pull
on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC (06:00 ET in summer, 05:00 ET in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/**"]   # bot commits touch only these, so no loop
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: weekly
jobs:
  pull-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python run.py all
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Commit data + site
        run: |
          git config user.name "token-dash bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          git commit -m "weekly pull $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: pull-and-build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
