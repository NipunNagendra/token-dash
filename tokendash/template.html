<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Desk | Weekly Inference Markets</title><meta name="description" content="Weekly inference demand, model share, open-weight usage and actual token prices, with source coverage and bias.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0f1114;--rail:#0b0d10;--panel:#161a1f;--panel2:#1c2127;--line:#262c34;--line2:#323a44;--ink:#eef1f4;--ink2:#b3bcc7;--mute:#76808c;--acc:#5aa0f2;--ok:#3fb950;--warn:#d9a441;--bad:#e5626a;
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink2);font:13px/1.45 var(--sans)}
a{color:var(--acc)}button{font:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:4px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}.brand b{color:var(--ink);font-weight:600;font-size:14px;display:block}.brand span{color:var(--mute);font-size:11px;font-family:var(--mono)}
.nav{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:4px;cursor:pointer;color:var(--ink2);border:1px solid transparent}
.nav:hover{background:var(--panel)}.nav.on{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}.nav .dot.ok{background:var(--ok)}.nav .dot.miss{background:var(--warn)}
.nav .t{flex:1;min-width:0}.nav .t small{display:block;color:var(--mute);font-family:var(--mono);font-size:10px}
.rail .foot{margin-top:auto;color:var(--mute);font-size:10px;padding:8px;font-family:var(--mono);line-height:1.5}
.main{padding:18px 22px 60px;min-width:0}
.panel{display:none}.panel.on{display:block}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-size:20px;color:var(--ink);margin:0 0 4px;font-weight:600;text-wrap:balance}.ph p{margin:0;max-width:70ch}
.ph .skew{color:var(--mute);font-size:12px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border:1px solid var(--line2);border-radius:3px;color:var(--ink2);background:var(--panel)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}.chip.miss .dot{background:var(--warn)}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px}
.read{background:var(--panel);padding:10px 12px}.read .l{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.read .v{font-family:var(--mono);font-size:20px;color:var(--ink);margin-top:2px;line-height:1.2}.read .s{color:var(--ink2);font-size:11px;margin-top:2px}
.read .v .u{color:var(--mute);font-size:12px}
.block{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.bh{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.bh h2{font-size:12px;color:var(--ink);margin:0;font-weight:600;letter-spacing:.02em}.bh .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}.seg button{background:transparent;border:0;color:var(--ink2);padding:3px 9px;cursor:pointer;font-size:11px;border-right:1px solid var(--line2)}.seg button:last-child{border-right:0}.seg button.on{background:var(--panel2);color:var(--ink)}.seg button:focus-visible{outline:1px solid var(--acc);outline-offset:-1px}
.lbl{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:-4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ent{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:3px;padding:2px 8px;font-size:11px;color:var(--ink2);background:transparent;cursor:pointer;opacity:.55}.ent.on{opacity:1;background:var(--panel2);color:var(--ink)}.ent i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ent:focus-visible{outline:1px solid var(--acc)}
.plot{height:340px;width:100%}.plot.sm{height:280px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);color:var(--mute);text-align:left;font-weight:500;font-size:11px;padding:6px 10px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}th.n,td.n{text-align:right;font-family:var(--mono);font-size:12px}
th.s::after{content:" ↓";color:var(--acc)}th.s.asc::after{content:" ↑"}
td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink2)}td.k{color:var(--ink)}tr:hover td{background:var(--panel2)}
td.up{color:var(--ok)}td.dn{color:var(--bad)}td.def{white-space:normal;min-width:320px;max-width:560px}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.spark{vertical-align:middle}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}.empty b{display:block;color:var(--ink2);margin-bottom:4px;font-weight:500}.empty code{font-family:var(--mono);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:14px}
.note{padding:8px 12px;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
input.q{background:var(--bg);border:1px solid var(--line2);color:var(--ink);padding:3px 8px;border-radius:3px;font:inherit;font-size:12px;width:200px}input.q:focus{outline:1px solid var(--acc)}
.board td.c{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink)}
.meth{max-width:72ch}.meth li{margin:6px 0}.meth h3{color:var(--ink);font-size:13px;margin:16px 0 6px}
.hm{display:none}
@media (max-width:800px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.rail .foot,.brand span{display:none}.nav .t small{display:none}}
@media (prefers-reduced-motion:no-preference){.nav,.ent{transition:background .12s}}
{{TERMINAL_CSS}}
</style></head><body>
<div class="app">
<aside class="rail">
 <div class="brand"><b>Token Desk</b><span>LLM usage · weekly · {{DATE}}</span></div>
 <div id="nav"></div>
 <div class="foot">Source: OpenRouter (openrouter.ai/rankings), Vercel AI Gateway (CC BY 4.0), Artificial Analysis, Cloudflare Radar, Ramp.</div>
</aside>
<main class="main" id="main"></main>
</div>
<script src="{{PLOTLY}}"></script>
<script data-offline-fallback>if(typeof Plotly==='undefined'){const unavailable=id=>{const el=document.getElementById(id);if(el)el.innerHTML='<div class="empty"><b>Chart unavailable offline</b>Tables and readings remain available. Reconnect to load the chart library.</div>'};globalThis.Plotly={react:unavailable,newPlot:unavailable,Plots:{resize(){}}}}</script>
<script>
const D={{DATA}};
/* ---------- palette: colour follows the entity, never its rank ---------- */
const LAB={Anthropic:"#5aa0f2",OpenAI:"#e8743b",Google:"#2fb383",DeepSeek:"#d9a441",xAI:"#d75d8e",Meta:"#4caf50",Qwen:"#9d8df1",Mistral:"#ef6e6e",
 "Z.ai":"#5fc3c9",Moonshot:"#c9a06a",StepFun:"#8fb36a",MiniMax:"#b07fd0",NVIDIA:"#76b900",Xiaomi:"#f2a541",Tencent:"#3aa0d8",ByteDance:"#a67c52",Other:"#76808c","Other (outside top 50)":"#4a525c"};
const EXTRA=["#7aa2b8","#b89a7a","#8aa07a","#a08ab8","#b87a8a","#7ab8a0","#b8b07a","#7a88b8"];const extraIdx={};
function col(name){if(LAB[name])return LAB[name];const lab=modelLab(name);if(lab&&LAB[lab])return LAB[lab];if(!(name in extraIdx))extraIdx[name]=Object.keys(extraIdx).length;return EXTRA[extraIdx[name]%EXTRA.length]}
function modelLab(name){if(D.openrouter.models&&D.openrouter.models[name])return D.openrouter.models[name].lab;const m=/^(Claude|GPT|Gemini|Gemma|DeepSeek|Grok|Llama|Muse|Qwen|Mistral|GLM|Kimi|Step|MiniMax)/i.exec(name||"");
 const map={claude:"Anthropic",gpt:"OpenAI",gemini:"Google",gemma:"Google",deepseek:"DeepSeek",grok:"xAI",llama:"Meta",muse:"Meta",qwen:"Qwen",mistral:"Mistral",glm:"Z.ai",kimi:"Moonshot",step:"StepFun",minimax:"MiniMax"};return m?map[m[1].toLowerCase()]:null}
/* ---------- formatting ---------- */
const fT=x=>x==null||isNaN(x)?"—":x>=1e15?(x/1e15).toFixed(2)+"Q":x>=1e12?(x/1e12).toFixed(2)+"T":x>=1e9?(x/1e9).toFixed(1)+"B":x>=1e6?(x/1e6).toFixed(0)+"M":Math.round(x).toLocaleString();
const fP=(x,d=1)=>x==null||isNaN(x)?"—":(x*100).toFixed(d)+"%";const fPP=x=>x==null||isNaN(x)?"—":(x>0?"+":"")+(x*100).toFixed(1)+"pp";const fS=x=>x==null||isNaN(x)?"—":(x>0?"+":"")+(x*100).toFixed(1)+"%";
const f$=x=>x==null||isNaN(x)?"—":"$"+(x<0.1?x.toFixed(3):x.toFixed(2));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function spark(v,w=84,h=20){if(!v||!v.length)return"";const vals=v.filter(x=>typeof x==='number'&&Number.isFinite(x));if(!vals.length)return"";const lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo;let path='',gap=true;v.forEach((x,i)=>{if(x==null||!Number.isFinite(x)){gap=true;return}const px=v.length===1?w/2:i*w/(v.length-1),py=span?h-2-(x-lo)/span*(h-4):h/2;path+=(gap?'M':'L')+px.toFixed(1)+','+py.toFixed(1)+' ';gap=false});return `<svg class="spark" width="${w}" height="${h}" role="img" aria-label="Recent trend"><path d="${path}" fill="none" stroke="#91b6bd" stroke-width="1.4"/></svg>`}
/* ---------- plotly base ---------- */
const CFG={displayModeBar:false,responsive:true};
function lay(o={}){const b={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"#161a1f",font:{family:"IBM Plex Sans,system-ui,sans-serif",size:11,color:"#b3bcc7"},margin:{l:48,r:16,t:10,b:36},hovermode:"x unified",showlegend:false,
 xaxis:{gridcolor:"#262c34",zeroline:false,linecolor:"#323a44",tickfont:{color:"#76808c"}},yaxis:{gridcolor:"#262c34",zeroline:false,linecolor:"#323a44",tickfont:{color:"#76808c",family:"IBM Plex Mono"}},hoverlabel:{bgcolor:"#1c2127",bordercolor:"#323a44",font:{color:"#eef1f4",size:11,family:"IBM Plex Mono"}}};
 b.plot_bgcolor="#121820";b.xaxis.gridcolor="#26323e";b.yaxis.gridcolor="#26323e";
 for(const k in o){if(o[k]&&typeof o[k]==="object"&&b[k]&&typeof b[k]==="object")Object.assign(b[k],o[k]);else b[k]=o[k]}return b}
/* ---------- generic widgets ---------- */
function seg(id,opts,val,on){return`<span class="seg" id="${id}">${opts.map(o=>`<button data-v="${o[0]}" class="${o[0]===val?"on":""}">${o[1]}</button>`).join("")}</span>`}
function bindSeg(id,fn){const el=document.getElementById(id);el.querySelectorAll("button").forEach(b=>b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fn(b.dataset.v)})}
function table(host,cols,rows,sortKey,desc=true){
 const st={k:sortKey,d:desc};
 function render(){const r=[...rows].sort((a,b)=>{const x=a[st.k],y=b[st.k];if(x==null)return 1;if(y==null)return -1;return(typeof x==="number"?x-y:String(x).localeCompare(String(y)))*(st.d?-1:1)});
  host.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th tabindex="0" role="columnheader" aria-sort="${st.k===c.k?(st.d?'descending':'ascending'):'none'}" class="${c.n?"n":""} ${st.k===c.k?"s"+(st.d?"":" asc"):""}" data-k="${c.k}">${c.h}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr>${cols.map(c=>{const v=row[c.k];const cls=[c.n?"n":"",c.cls?c.cls(v,row):"",c.k===cols[0].k?"k":""].join(" ");return`<td class="${cls}">${c.f?c.f(v,row):esc(v)}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
  host.querySelectorAll("th").forEach(th=>{th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();th.click()}};th.onclick=()=>{const k=th.dataset.k;if(st.k===k)st.d=!st.d;else{st.k=k;st.d=true}render()}})}
 render()}
function empty(title,how){return`<div class="empty"><b>${esc(title)}</b>${how}</div>`}
function windowRange(dates,w){if(!w)return null;const end=new Date(dates[dates.length-1]);const s=new Date(end);s.setDate(s.getDate()-7*w);return[s.toISOString().slice(0,10),dates[dates.length-1]]}
function idxAgo(dates,days){return dates.indexOf(T.add(dates[dates.length-1],-days))}
const labChip=n=>`<span class="sw" style="background:${col(n)}"></span>${esc(n)}`;
/* ---------- nav ---------- */
const PANELS=[...D.sourceOrder.map(id=>({id,name:D.sources[id].name,src:D.sources[id]})),{id:"overview",name:"Weekly desk"},{id:"method",name:"Methodology"}];
PANELS.unshift(PANELS.splice(PANELS.findIndex(p=>p.id==="overview"),1)[0]);
const nav=document.getElementById("nav");
nav.innerHTML=PANELS.map(p=>`<button class="nav" data-p="${p.id}"><span class="dot ${p.src?(p.src.ok?"ok":"miss"):""}" style="${p.src?"":"visibility:hidden"}"></span><span class="t">${esc(p.name)}${p.src?`<small>${p.src.ok?"as of "+p.src.asof:"no data"}</small>`:""}</span></button>`).join("");
const main=document.getElementById("main");
main.innerHTML=PANELS.map(p=>`<section class="panel" id="p-${p.id}"></section>`).join("");
const built={};
const RO=new ResizeObserver(es=>es.forEach(e=>{const p=e.target;if(typeof Plotly!=="undefined"&&p._fullLayout&&e.contentRect.width>0&&Math.abs(p._fullLayout.width-e.contentRect.width)>2)Plotly.Plots.resize(p)}));
function show(id){document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.p===id));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
 const pane=document.getElementById("p-"+id);
 if(!built[id]){BUILD[id](pane);built[id]=true;pane.querySelectorAll(".plot").forEach(p=>RO.observe(p))}
 requestAnimationFrame(()=>pane.querySelectorAll(".plot").forEach(p=>{if(typeof Plotly!=="undefined"&&p._fullLayout)Plotly.Plots.resize(p)}))
 try{localStorage.setItem("tm_panel",id)}catch(e){}location.hash=id}
nav.querySelectorAll(".nav").forEach(n=>n.onclick=()=>show(n.dataset.p));
function head(src,extra=""){return`<div class="ph"><div><h1>${esc(src.name)}</h1><p>${esc(src.what)}</p><div class="skew">Skew: ${esc(src.skew)}</div></div><div><span class="chip ${src.ok?"":"miss"}"><span class="dot"></span>${src.ok?"as of "+src.asof:"no data yet"}</span> <span class="chip">${esc(src.unit)}</span>${extra}</div></div>`}
const BUILD={};
/* ================= OVERVIEW ================= */
/* ================= OPENROUTER ================= */
BUILD.openrouter=function(el){
 const o=D.openrouter,src=D.sources.openrouter;
 if(!o.ok){el.innerHTML=head(src)+`<div class="block">${empty("No OpenRouter rows yet.","No complete observed week is available. See source coverage and the collection log for the latest result.")}</div>`;return}
 const n=o.weeks.length-1,tot=o.total;const a4=o.weeks.indexOf(T.add(o.weeks[n],-28));
 const labs=Object.keys(o.labs).filter(l=>!l.startsWith("Other (")).sort((a,b)=>o.labs[b][n]-o.labs[a][n]);
 const models=Object.keys(o.models).sort((a,b)=>o.models[b].v[n]-o.models[a].v[n]);
 const st={group:"lab",view:"abs",win:26,stack:"lines",sel:new Set(labs.slice(0,8))};
 const lead=labs[0];
 el.innerHTML=head(src)+`<div class="reads">
  <div class="read"><div class="l">Tokens this week</div><div class="v">${fT(tot[n])}</div><div class="s">week of ${o.weeks[n]} · ${fS(tot[n]/tot[n-1]-1)} wk/wk · ${fS(tot[n]/tot[a4]-1)} vs 4 wks ago</div></div>
  <div class="read"><div class="l">Leading lab</div><div class="v">${labChip(lead)}</div><div class="s">${fP(o.labs[lead][n]/tot[n])} of tokens · ${fPP(o.labs[lead][n]/tot[n]-o.labs[lead][a4]/tot[a4])} over 4 wks</div></div>
  <div class="read"><div class="l">Leading model</div><div class="v" style="font-size:15px">${esc(models[0])}</div><div class="s">${fP(o.models[models[0]].v[n]/tot[n])} of tokens</div></div>
  <div class="read"><div class="l">Top-50 coverage</div><div class="v">${fP(o.coverage,0)}</div><div class="s">of all OpenRouter tokens are in the named rows; the rest is "other"</div></div></div>
 <div class="block"><div class="bh"><h2>Weekly tokens</h2><span class="sp"></span><span class="lbl">by</span>${seg("or-g",[["lab","Lab"],["model","Model"]],"lab")}<span class="lbl">show</span>${seg("or-v",[["abs","Tokens"],["share","Share"]],"abs")}${seg("or-s",[["lines","Lines"],["stack","Stacked"]],"lines")}<span class="lbl">window</span>${seg("or-w",[["13","13w"],["26","26w"],["52","52w"],["0","All"]],"26")}</div>
  <div class="chips" id="or-chips"></div><div class="plot" id="or-plot"></div></div>
 <div class="block"><div class="bh"><h2>Latest week by <span id="or-tl">lab</span></h2><span class="sp"></span><span class="lbl">sorted by tokens; click a header to re-sort</span></div><div id="or-table"></div></div>
 ${o.apps?`<div class="block"><div class="bh"><h2>Apps sending the most tokens</h2><span class="sp"></span>${seg("or-a",[["popular_all","All apps"],["popular_coding","Coding apps"],["trending_all","Trending"]],"popular_all")}<span class="lbl">${esc(o.apps_window)}</span></div><div id="or-apps"></div><div class="note">Public apps only. "Trending" ranks by token growth versus the three preceding windows.</div></div>`:""}`;
 const ents=()=>st.group==="lab"?labs:models;
 function chips(){const list=ents().slice(0,st.group==="lab"?20:30);document.getElementById("or-chips").innerHTML=list.map(e=>`<button class="ent ${st.sel.has(e)?"on":""}" data-e="${esc(e)}"><i style="background:${col(e)}"></i>${esc(e)}</button>`).join("")+`<button class="ent on" data-e="__all" style="opacity:.8">all / none</button>`;
  document.getElementById("or-chips").querySelectorAll(".ent").forEach(b=>b.onclick=()=>{const e=b.dataset.e;if(e==="__all"){if(st.sel.size)st.sel.clear();else list.forEach(x=>st.sel.add(x))}else{st.sel.has(e)?st.sel.delete(e):st.sel.add(e)}chips();plot()})}
 function series(e){return st.group==="lab"?o.labs[e]:o.models[e].v}
 function plot(){const tr=ents().filter(e=>st.sel.has(e)).map(e=>{const v=series(e).map((x,i)=>st.view==="share"?x/tot[i]:x);return{x:o.weeks,y:v,name:e,mode:"lines",line:{width:st.stack==="stack"?.6:2,color:col(e)},stackgroup:st.stack==="stack"?"a":undefined,fillcolor:col(e),hovertemplate:(st.view==="share"?"%{y:.1%}":"%{y:.3s}")+"<extra>"+esc(e)+"</extra>"}});
  const r=windowRange(o.weeks,+st.win);Plotly.react("or-plot",tr,lay({yaxis:{tickformat:st.view==="share"?".0%":".2s",rangemode:"tozero"},xaxis:{range:r}}),CFG)}
 function tbl(){document.getElementById("or-tl").textContent=st.group;const rows=ents().map(e=>{const v=series(e);const m=st.group==="model"?o.models[e]:null;return{e,lab:m?m.lab:e,open:m?m.open:null,rel:m?m.rel:null,tok:v[n],d4:v[a4]?v[n]/v[a4]-1:null,share:v[n]/tot[n],dsh:v[n]/tot[n]-v[a4]/tot[a4],neu:v.slice(0,a4+1).every(x=>!x)&&v[n]>0,sp:v.slice(-13)}});
  const cols=[{k:"e",h:st.group==="lab"?"Lab":"Model",f:(v,r)=>(r.neu?`<span class="chip" style="padding:0 5px;font-size:10px;color:var(--acc)">new</span> `:"")+labChip(v)}];
  if(st.group==="model")cols.push({k:"lab",h:"Lab"},{k:"open",h:"Weights",f:v=>v==null?"?":v?"open":"closed"},{k:"rel",h:"Released",f:v=>v||"—"});
  cols.push({k:"tok",h:"Tokens / wk",n:1,f:fT},{k:"d4",h:"vs 4 wks ago",n:1,f:fS,cls:v=>v>0?"up":v<0?"dn":""},{k:"share",h:"Share",n:1,f:fP},{k:"dsh",h:"Share Δ 4w",n:1,f:fPP,cls:v=>v>0?"up":v<0?"dn":""},{k:"sp",h:"13 weeks",f:v=>spark(v)});

/* ================= METHOD ================= */
BUILD.method=function(el){
 el.innerHTML=`<div class="ph"><div><h1>Methodology</h1><p>How the page is built and what each number can and cannot say.</p></div></div><div class="meth">
 <h3>Principle</h3><ul><li>No public source is the market. Each is a slice with a known skew, stated on its panel. The page never fuses sources into one share number.</li><li>Changes can be compared directionally; units, populations and periods remain different. Vercel token and spend metrics are one source, not independent confirmations.</li><li>Token share and spend share can diverge. Neither is inferred from the other.</li></ul>
 <h3>Definitions</h3><ul><li><b>Week</b>: Monday–Sunday with seven observed dates. OpenRouter tokens are summed; Vercel daily shares are averaged across seven observed days (not volume-weighted). Calendar-exact comparison periods are required. Missing periods do not become zero.</li><li><b>Weekly desk</b>: 1W, 4W or 13W comparison controls share changes. Volume cards always show current and prior WoW growth. Ramp uses the prior calendar month; Cloudflare requires a rank on the exact comparison date. Each column shows its own dates.</li><li><b>Recent listings</b>: catalog creation within eight weeks of the observed OpenRouter week, not a verified lab announcement. Share changes cannot distinguish external share capture from cannibalization on their own.</li><li><b>Freshness</b>: more than 10 days behind the build date is stale for daily/weekly feeds; more than 75 days for monthly Ramp. A current source can still have unavailable historical comparisons.</li><li><b>Share</b>: entity tokens divided by all tokens in that source for that day or week, including the unnamed "other" bucket.</li><li><b>vs 4 weeks ago</b>: this week's value against the value four weeks earlier. Share Δ is in percentage points.</li><li><b>Price</b>: published input, output and cache-read prices per million tokens, shown separately. Missing cache prices stay unavailable. Same-model history is required to measure price declines. The price/quality envelope uses the selected input or output price and the latest available AA score, not an estimated workload.</li><li><b>Open weights</b>: the model has a Hugging Face id on OpenRouter, or its lab publishes all models openly. Open-weight share is calculated from model-level OpenRouter metadata only. It is not inferred from Vercel lab names. Unknown and unnamed models stay separate; the denominator includes all tokens. Catalog heuristics can misclassify models, so use model-map overrides when verified.</li></ul>
 <h3>Caveats</h3><ul><li>Token counts use each provider's own tokenizer; a token at one lab is not a token at another. Even within a lab, model mix and caching changes can affect the relationship to compute demand.</li><li>OpenRouter's user mix moves on its own (a free model appears, a coding tool changes routing). A jump there can be mix, not demand. That is why the cross-source board exists.</li><li>Vercel publishes share, not volume, over a rolling 60-day window. History accrues from weekly snapshots; no Vercel growth rate is possible.</li><li>Ramp is adoption (share of firms paying), not usage. Cloudflare is rank only. Disclosures are marketing figures with inconsistent definitions and are never connected.</li></ul>
