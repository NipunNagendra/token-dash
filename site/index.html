BUILD.method=function(el){
 el.innerHTML=`<div class="ph"><div><h1>Methodology</h1><p>How the page is built and what each number can and cannot say.</p></div></div><div class="meth">
 <h3>Principle</h3><ul><li>No public source is the market. Each is a slice with a known skew, stated on its panel. The page never fuses sources into one share number.</li><li>Changes can be compared directionally; units, populations and periods remain different. Vercel token and spend metrics are one source, not independent confirmations.</li><li>Token share and spend share can diverge. Neither is inferred from the other.</li></ul>
 <h3>Definitions</h3><ul><li><b>Week</b>: Monday–Sunday with seven observed dates. OpenRouter tokens are summed; Vercel daily shares are averaged across seven observed days (not volume-weighted). Calendar-exact comparison periods are required. Missing periods do not become zero.</li><li><b>Weekly desk</b>: 1W, 4W or 13W comparison controls share changes. Volume cards always show current and prior WoW growth. Ramp uses the prior calendar month; Cloudflare requires a rank on the exact comparison date. Each column shows its own dates.</li><li><b>Recent listings</b>: catalog creation within eight weeks of the observed OpenRouter week, not a verified lab announcement. Share changes cannot distinguish external share capture from cannibalization on their own.</li><li><b>Freshness</b>: more than 10 days behind the build date is stale for daily/weekly feeds; more than 75 days for monthly Ramp. A current source can still have unavailable historical comparisons.</li><li><b>Share</b>: entity tokens divided by all tokens in that source for that day or week, including the unnamed "other" bucket.</li><li><b>vs 4 weeks ago</b>: this week's value against the value four weeks earlier. Share Δ is in percentage points.</li><li><b>Price</b>: published input, output and cache-read prices per million tokens, shown separately. Missing cache prices stay unavailable. Same-model history is required to measure price declines. The price/quality envelope uses the selected input or output price and the latest available AA score, not an estimated workload.</li><li><b>Open weights</b>: the model has a Hugging Face id on OpenRouter, or its lab publishes all models openly. Open-weight share is calculated from model-level OpenRouter metadata only. It is not inferred from Vercel lab names. Unknown and unnamed models stay separate; the denominator includes all tokens. Catalog heuristics can misclassify models, so use model-map overrides when verified.</li></ul>
 <h3>Caveats</h3><ul><li>Token counts use each provider's own tokenizer; a token at one lab is not a token at another. Even within a lab, model mix and caching changes can affect the relationship to compute demand.</li><li>OpenRouter's user mix moves on its own (a free model appears, a coding tool changes routing). A jump there can be mix, not demand. That is why the cross-source board exists.</li><li>Vercel publishes share, not volume, over a rolling 60-day window. History accrues from weekly snapshots; no Vercel growth rate is possible.</li><li>Ramp is adoption (share of firms paying), not usage. Cloudflare is rank only. Disclosures are marketing figures with inconsistent definitions and are never connected.</li></ul>
 <h3>Attribution</h3><p>Source: OpenRouter (openrouter.ai/rankings, openrouter.ai/apps), as of ${D.openrouter.asof||D.built}. Vercel AI Gateway leaderboard, CC BY 4.0. Quality indices by Artificial Analysis. Ramp AI Index. Cloudflare Radar.</p>

/* Calendar-based comparisons. Null means unavailable, never zero. */

  const aliases={'ChatGPT / OpenAI':'OpenAI','Claude / Anthropic':'Anthropic','Google Gemini':'Google','Grok / xAI':'xAI','Meta AI':'Meta','DeepSeek':'DeepSeek','Mistral':'Mistral','Qwen':'Qwen'};

  const cell=(value,prev)=>({value:value??null,delta:change(value,prev)});

 function filtered(){return p.rows.filter(r=>(r.name+' '+r.model+' '+r.lab).toLowerCase().includes(st.q)&&(st.weights==='all'||(st.weights==='unknown'?r.open==null:st.weights==='open'?r.open===true:r.open===false)))}
 function render(){const rows=filtered(),pts=rows.filter(r=>r.idx!=null&&r[st.axis]>0),fr=T.envelope(pts,st.axis);plotSafe('pr-plot',[...([...new Set(pts.map(r=>r.lab))].map(l=>{const rs=pts.filter(r=>r.lab===l);return{x:rs.map(r=>r.idx),y:rs.map(r=>r[st.axis]),text:rs.map(r=>r.name),name:l,mode:'markers',marker:{color:col(l),size:9},hovertemplate:'%{text}<br>AA %{x} · $%{y:.3f}/1M<extra></extra>'}})),{x:fr.map(r=>r.idx),y:fr.map(r=>r[st.axis]),mode:'lines',line:{color:'#dac09a',dash:'dot'},hoverinfo:'skip'}],{hovermode:'closest',xaxis:{title:{text:'Artificial Analysis score · higher is better'}},yaxis:{type:'log',tickprefix:'$',title:{text:'$ / million tokens · log scale'}}});
 table(document.getElementById('pr-table'),[{k:'model',h:'Model'},{k:'lab',h:'Lab',f:labChip},{k:'open',h:'Weights',f:v=>v==null?'unknown':v?'open':'closed'},{k:'idx',h:'AA score',n:1,f:v=>v??'—'},{k:'coding',h:'Coding',n:1,f:v=>v??'—'},{k:'agentic',h:'Agentic',n:1,f:v=>v??'—'},{k:'pin',h:'Input $ / million',n:1,f:f$},{k:'pout',h:'Output $ / million',n:1,f:f$},{k:'pcache',h:'Cached input $ / million',n:1,f:f$},{k:'created',h:'Listed'}],rows,'idx')}
 function history(){const rows=p.history[st.model]||[],first=rows[0],last=rows.at(-1);document.getElementById('pr-history').innerHTML=`<div class="inline-stats"><span>${rows.length} observations</span><span>${first?.date||'—'} → ${last?.date||'—'}</span><span>Input-price change <b>${rows.length>1?fS(T.growth(last.pin,first.pin)):'—'}</b></span><span>Output-price change <b>${rows.length>1?fS(T.growth(last.pout,first.pout)):'—'}</b></span></div>`;plotSafe('pr-history-chart',['pin','pout'].map((k,i)=>({x:rows.map(r=>r.date),y:rows.map(r=>r[k]),name:i?'Output':'Input',mode:'lines+markers',line:{shape:'hv',color:i?'#dac09a':'#8abfb0'},hovertemplate:'$%{y:.3f}/1M<extra>%{fullData.name}</extra>'})),{showlegend:true,yaxis:{tickprefix:'$',rangemode:'tozero',title:{text:'$ / million tokens'}}})}
 bindSeg('pr-axis',v=>{st.axis=v;render()});bindSeg('pr-o',v=>{st.weights=v;render()});document.getElementById('pr-q').oninput=e=>{st.q=e.target.value.toLowerCase();render()};document.getElementById('pr-model').onchange=e=>{st.model=e.target.value;history()};
 if(p.changes.length)table(document.getElementById('pr-ch'),[{k:'model',h:'Model'},{k:'old_date',h:'Previous date'},{k:'new_date',h:'Current date'},{k:'in_old',h:'Input was',n:1,f:f$},{k:'in_new',h:'Input now',n:1,f:f$},{k:'out_old',h:'Output was',n:1,f:f$},{k:'out_new',h:'Output now',n:1,f:f$}],p.changes,'model',false);else document.getElementById('pr-ch').innerHTML=empty(p.n_snapshots>1?'No quoted input/output changes':'Comparison not available',p.n_snapshots>1?'Among the same models present in both snapshots.':'A second price observation is required.');render();history();
};

/* ---------- boot ---------- */
let start=location.hash.slice(1);if(!PANELS.some(p=>p.id===start))start="overview";show(start);
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(PANELS.some(p=>p.id===id))show(id)});
</script></body></html>
